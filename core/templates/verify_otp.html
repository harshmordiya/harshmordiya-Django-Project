<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
</head>
<body>

    <h1>Verify OTP</h1>

    <p>
        Enter the OTP sent to your email.
    </p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="otp">OTP:</label>
            <input
                type="text"
                id="otp"
                name="otp"
                maxlength="6"
                required
            >
        </div>

        <br>

        <button type="submit">
            Verify OTP
        </button>
    </form>

</body>
</html>
