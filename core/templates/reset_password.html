<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
</head>
<body>

    <h1>Reset Password</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="password">New Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <br>

        <div>
            <label for="confirm_password">
                Confirm Password:
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Reset Password
        </button>
    </form>

    <p>
        <a href="{% url 'login' %}">
            Back to Login
        </a>
    </p>

</body>
</html>
