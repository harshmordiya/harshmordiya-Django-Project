<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
</head>
<body>

    <h1>Forgot Password</h1>

    <p>
        Enter your registered email address to receive an OTP.
    </p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <br>

        <button type="submit">
            Send OTP
        </button>
    </form>

    <p>
        <a href="{% url 'login' %}">
            Back to Login
        </a>
    </p>

</body>
</html>
